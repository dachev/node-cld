os: Visual Studio 2022
version: "{build}"
build: off
platform: x64
environment:
  matrix:
  - nodejs_version: "20"
    nodejs_arch: "x64"
  - nodejs_version: "22"
    nodejs_arch: "x64"
install:
  - ps: Install-Product node $env:nodejs_version $env:nodejs_arch
  - npm install
test_script:
  - npm test
